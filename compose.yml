# Whisker & Heat on its own server: the app, its database and a nightly backup.
# Values come from .env.production on the server (see .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 4317
      PUBLIC_ORIGIN: https://${DOMAIN}
      DATABASE_URL: postgres://whisker:${POSTGRES_PASSWORD}@db:5432/whisker
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      WF_WORKFLOW_TOKEN: ${WF_WORKFLOW_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks: [default, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.whisker.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.whisker.entrypoints=https
      - traefik.http.routers.whisker.tls=true
      - traefik.http.routers.whisker.tls.certresolver=letsencrypt
      - traefik.http.routers.whisker-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.whisker-http.entrypoints=http
      - traefik.http.routers.whisker-http.middlewares=whisker-https
      - traefik.http.middlewares.whisker-https.redirectscheme.scheme=https
      - traefik.http.services.whisker.loadbalancer.server.port=4317

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whisker
      POSTGRES_DB: whisker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "whisker"]
      interval: 5s
      retries: 20

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups]
    depends_on: [db]
    # Every night at 03:00 server time: a compressed dump, keeping the last 14.
    entrypoint: ["/bin/sh", "-c", "echo '0 3 * * * pg_dump -h db -U whisker whisker | gzip > /backups/whisker-$$(date +\\%F).sql.gz && ls -1t /backups/*.sql.gz | tail -n +15 | xargs -r rm' | crontab - && crond -f"]

volumes:
  db:

networks:
  coolify:
    external: true
